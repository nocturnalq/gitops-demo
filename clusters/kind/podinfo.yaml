# Что должно быть в кластере kind: приложение podinfo из apps/podinfo.
# Flux сам применяет этот файл (FluxInstance смотрит в clusters/kind),
# а дальше уже этот объект применяет apps/podinfo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m      # как часто сверять кластер с git, даже если коммитов не было
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/podinfo
  prune: true       # удалили файл из git - удаляем объект из кластера
  wait: true        # считать применение успешным, только когда поды готовы
  timeout: 1m
